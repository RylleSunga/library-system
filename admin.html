<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Library System</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>window.location.replace('admin.php');</script>
</head>
<body>
    <header class="navbar">
        <div class="logo">📚 Library System</div>
        <nav>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="mybooks.html">My Books</a></li>
                <li><a href="index.html">Logout</a></li>
            </ul>
        </nav>
    </header>

    <section class="book-section">
        <h2>Admin Panel - Add New Book</h2>
        <p><a href="view_records.php">View, search, update, or delete book records</a></p>
        <form id="add-book-form">
            <input type="text" id="title" placeholder="Book Title" required>
            <input type="text" id="author" placeholder="Author" required>
            <input type="text" id="image" placeholder="Image URL" required>
            <button type="submit">Add Book</button>
        </form>
    </section>

    <script>
        const form = document.getElementById('add-book-form');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const image = document.getElementById('image').value;

            // Get existing books from localStorage
            let books = JSON.parse(localStorage.getItem('books')) || [];

            // Add new book
            books.push({ title, author, image });
            localStorage.setItem('books', JSON.stringify(books));

            alert(`✅ "${title}" has been added to the library!`);

            // Clear form
            form.reset();
        });
    </script>
</body>
</html>
